<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
    <style>
                body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            
            justify-content: center;
            align-items: center;
            height: 50vh;
            margin: 0;
            background-color: #f4f7f6;
        }

.form{

align-items:center;
}
            </style>
</head>
<body>
<h1 class="form">Live Print:</h1>
<input type="text" id="userInput" placeholder="Enter Name..."><br><br>
<button onclick="printName()">Submit</button>
<h2 id="displayArea"></h2>
<script>
function printName() 
{
var name = document.getElementById("userInput").value;
document.getElementById("displayArea").innerHTML = "Hello, " + name + "!";
}
</script>

</body>
</html>
